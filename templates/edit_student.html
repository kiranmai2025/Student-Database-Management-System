{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="card-title mb-0 fw-bold">Edit Student Details</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('edit_student', id=student.id) }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Roll Number</label>
                            <input type="text" name="roll_no" class="form-control" value="{{ student.roll_no }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ student.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ student.phone }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Department</label>
                            <select name="department" class="form-select" required>
                                {% for dept in ['ECE', 'CSE', 'EEE', 'IT', 'Civil', 'Mechanical'] %}
                                    <option value="{{ dept }}" {% if student.department == dept %}selected{% endif %}>{{ dept }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Residence Type</label>
                            <select name="residence_type" class="form-select" required>
                                <option value="Day Scholar" {% if student.residence_type == 'Day Scholar' %}selected{% endif %}>Day Scholar</option>
                                <option value="Hosteler" {% if student.residence_type == 'Hosteler' %}selected{% endif %}>Hosteler</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-end gap-2">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-light border">Cancel</a>
                        <button type="submit" class="btn btn-primary fw-semibold px-4">Update Student</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
